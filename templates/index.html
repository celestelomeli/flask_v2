<!DOCTYPE html>
<html lang="en"> <!-- Set language for accessibility -->
<head>
    <!-- Define character encoding -->
    <meta charset="UTF-8">
    <!-- Make site responsive on mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter your name</title>
    <!-- Link to CSS file using Flask's url_for -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <!-- Container div to create the centered white card -->
    <div class="container">
        <h1>Welcome!</h1>
        <!-- Form posts to /greet route when submitted -->
        <form action="/greet" method="post">
            <label for="name">Please enter your name:</label>
            <!-- Required attribute prevents empty submissions -->
            <input type="text" id="name" name="name" required>
            <input type="submit" value="Submit">
        </form>
    </div>
</body>
</html>
