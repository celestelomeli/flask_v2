<!DOCTYPE html>
<html lang="en"> <!-- Set language for accessibility -->
<head>
    <!-- Define character encoding -->
    <meta charset="UTF-8">
    <!-- Make site responsive on mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greeting</title>
    <!-- Link to CSS file using Flask's url_for -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <!-- Container div to create the centered white card -->
    <div class="container">
        <!-- Display the name passed from Flask using Jinja2 template syntax -->
        <h1>Hi, {{ name }}!</h1>
        <p>Pleasure to meet you!</p>
        <!-- Link back to home page -->
        <a href="/" class="back-link">Go Back</a>
    </div>
</body>
</html>
